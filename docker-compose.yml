services:
  postgres:
    image: postgres:15-alpine
    container_name: emailscheduler-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: emailscheduler
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: emailscheduler-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
